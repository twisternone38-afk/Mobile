
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and build Android project
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle -not -path '*/.gradle/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            echo "Check that Android project files were uploaded."
            find . -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          echo "Found project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MobileGameEmulator.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGameEmulator-APK
          path: MobileGameEmulator.apk
